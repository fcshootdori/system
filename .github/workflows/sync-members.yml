# 회원현황 구글 시트 → 앱 회원 정보 자동 반영 (3시간마다 + 수동 실행)
#  준비: 저장소 Settings → Secrets and variables → Actions → New repository secret
#        이름 MEMBER_SHEET_ID, 값 = 회원 시트 주소(또는 ID)
name: 회원 시트 자동 반영
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-members.mjs
        env:
          MEMBER_SHEET_ID: ${{ secrets.MEMBER_SHEET_ID }}
          MEMBER_SHEET_GID: ${{ secrets.MEMBER_SHEET_GID }}
