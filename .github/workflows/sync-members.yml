# 통합 시트 › 회원 탭 → 앱 회원 정보 자동 반영 (3시간마다 + 수동 실행)
#  준비: 저장소 Settings → Secrets and variables → Actions → New repository secret
#        이름 SHEET_API_KEY, 값 = 통합 시트 연결 키 (시트 메뉴 슛도리 › 앱 연결 정보)
name: 통합 시트 회원 자동 반영
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-members.mjs
        env:
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
